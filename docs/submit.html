<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>投喂链接 - AI习语</title>
  <style>
    :root { color-scheme: light; --blue:#3c70c6; --ink:#20242a; --muted:#606975; --line:#dfe5ee; --bg:#f6f8fb; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    main { max-width: 760px; margin: 0 auto; padding: 42px 18px 56px; }
    .eyebrow { margin: 0 0 8px; color: var(--blue); font-size: 13px; font-weight: 700; letter-spacing: .04em; }
    h1 { margin: 0 0 10px; font-size: clamp(28px, 5vw, 44px); line-height: 1.08; letter-spacing: 0; }
    .lead { margin: 0 0 28px; color: var(--muted); font-size: 16px; line-height: 1.7; }
    form { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 14px; }
    label { font-size: 14px; font-weight: 700; }
    input, textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 12px 13px; font: inherit; color: var(--ink); background: #fff; }
    textarea { min-height: 96px; resize: vertical; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    button, a.button { appearance: none; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 8px; padding: 10px 14px; font-size: 14px; text-decoration: none; cursor: pointer; }
    button.primary { background: var(--blue); border-color: var(--blue); color: white; }
    button:disabled { opacity: .65; cursor: wait; }
    .hint { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .error { display: none; color: #b42318; font-size: 13px; margin: 0; }
    .status { display: none; margin: 0; color: #245b38; font-size: 14px; line-height: 1.7; }
    .status a { color: var(--blue); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">AI习语</p>
    <h1>投喂一篇文章</h1>
    <p class="lead">提交英文文章链接后，GitHub Actions 会抓取正文，按「AI习语」定位精翻、改写，并输出公众号 HTML。</p>
    <form id="feedForm">
      <div>
        <label for="accountUser">账号</label>
        <input id="accountUser" name="accountUser" type="text" autocomplete="username" placeholder="Normande" required>
      </div>
      <div>
        <label for="accountPassword">密码</label>
        <input id="accountPassword" name="accountPassword" type="password" autocomplete="current-password" required>
      </div>
      <div>
        <label for="articleUrl">文章链接</label>
        <input id="articleUrl" name="articleUrl" type="url" placeholder="https://example.com/article" required>
      </div>
      <div>
        <label for="note">备注</label>
        <textarea id="note" name="note" placeholder="可选：你希望关注的角度，例如提示词、英文表达、工作流、学习方法"></textarea>
      </div>
      <p class="error" id="errorText">请输入有效的 http 或 https 链接。</p>
      <div class="row">
        <p class="hint">配置直连后端后会直接提交到 GitHub Actions；未配置时会打开 GitHub Issue 队列，明文密码不会写入 Issue。</p>
        <div>
          <a class="button" href="./latest.html">返回文章</a>
          <button class="primary" id="submitButton" type="submit">提交到 Actions</button>
        </div>
      </div>
      <p class="status" id="statusText"></p>
    </form>
  </main>
  <script src="./submit-config.js"></script>
  <script>
    const form = document.getElementById("feedForm");
    const accountUserInput = document.getElementById("accountUser");
    const accountPasswordInput = document.getElementById("accountPassword");
    const urlInput = document.getElementById("articleUrl");
    const noteInput = document.getElementById("note");
    const errorText = document.getElementById("errorText");
    const statusText = document.getElementById("statusText");
    const submitButton = document.getElementById("submitButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      let articleUrl;
      try {
        articleUrl = new URL(urlInput.value.trim());
      } catch {
        showError("请输入有效的 http 或 https 链接。");
        return;
      }

      if (!["http:", "https:"].includes(articleUrl.protocol)) {
        showError("请输入有效的 http 或 https 链接。");
        return;
      }

      clearMessages();
      const accountUser = accountUserInput.value.trim();
      const accountPassword = accountPasswordInput.value;
      if (!accountUser || !accountPassword) {
        showError("请输入账号和密码。");
        return;
      }

      const submitEndpoint = String(window.ARTICLE_SUBMIT_ENDPOINT || "").trim();
      if (submitEndpoint) {
        await submitDirectly(submitEndpoint, articleUrl, accountUser, accountPassword);
        return;
      }

      const signature = await sha256Hex(`${accountUser}:${accountPassword}:${articleUrl.toString()}`);
      const title = `[Article Request] ${articleUrl.hostname}`;
      const body = [
        `ARTICLE_URL: ${articleUrl.toString()}`,
        `AUTH_USER: ${accountUser}`,
        `AUTH_SIGNATURE: ${signature}`,
        "",
        `NOTE: ${noteInput.value.trim() || "N/A"}`
      ].join("\n");
      const issueUrl = new URL("https://github.com/yanglei-985/article/issues/new");
      issueUrl.searchParams.set("title", title);
      issueUrl.searchParams.set("body", body);
      window.location.href = issueUrl.toString();
    });

    async function submitDirectly(endpoint, articleUrl, accountUser, accountPassword) {
      const requestId = `manual-${Date.now()}-${slugify(articleUrl.hostname)}`;
      submitButton.disabled = true;
      submitButton.textContent = "提交中...";
      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            accountUser,
            accountPassword,
            articleUrl: articleUrl.toString(),
            note: noteInput.value.trim(),
            requestId
          })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || payload.ok === false) {
          throw new Error(payload.error || "提交失败，请稍后重试。");
        }

        const articleLink = payload.articleUrl || buildExpectedArticleUrl(requestId);
        statusText.innerHTML = `已提交到 GitHub Actions，通常 2-4 分钟后生成：<a href="${escapeAttribute(articleLink)}">${escapeHtml(articleLink)}</a>`;
        statusText.style.display = "block";
        form.reset();
      } catch (error) {
        showError(error.message || "提交失败，请稍后重试。");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "提交到 Actions";
      }
    }

    function buildExpectedArticleUrl(requestId) {
      const date = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Shanghai",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());
      return `https://yanglei-985.github.io/article/articles/${date}-${requestId}.html`;
    }

    function showError(message) {
      statusText.style.display = "none";
      errorText.textContent = message;
      errorText.style.display = "block";
    }

    function clearMessages() {
      errorText.style.display = "none";
      statusText.style.display = "none";
    }

    async function sha256Hex(value) {
      const bytes = new TextEncoder().encode(value);
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      return [...new Uint8Array(digest)].map((byte) => byte.toString(16).padStart(2, "0")).join("");
    }

    function slugify(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 48) || "link";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replaceAll("`", "&#96;");
    }
  </script>
</body>
</html>
