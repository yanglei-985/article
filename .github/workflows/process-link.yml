name: Process Submitted Link

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: process-link-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  process:
    if: startsWith(github.event.issue.title, '[Article Request]') && github.event.issue.user.login == 'yanglei-985'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract request URL
        id: request
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const issue = event.issue;
          const text = `${issue.title}\n${issue.body || ""}`;
          const explicit = text.match(/ARTICLE_URL:\s*(https?:\/\/[^\s<>)\]]+)/i);
          const fallback = text.match(/https?:\/\/[^\s<>)\]]+/i);
          const url = explicit?.[1] || fallback?.[0];
          if (!url) {
            throw new Error("No URL found in issue body.");
          }

          const requestId = `issue-${issue.number}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\nrequest_id=${requestId}\n`);
          NODE

      - name: Generate article from submitted link
        id: generate
        run: node scripts/generate-daily-article.mjs
        env:
          ARTICLE_URL: ${{ steps.request.outputs.url }}
          ARTICLE_REQUEST_ID: ${{ steps.request.outputs.request_id }}
          PAGES_BASE_URL: https://yanglei-985.github.io/article
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}

      - name: Verify output
        run: node scripts/check-output.mjs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs outputs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: process submitted article link"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Reply to issue
        env:
          GH_TOKEN: ${{ github.token }}
          ARTICLE_URL: ${{ steps.generate.outputs.article_url }}
          SNIPPET_URL: ${{ steps.generate.outputs.snippet_url }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "处理完成：${ARTICLE_URL}

公众号 HTML：${SNIPPET_URL}"
          gh issue close "${{ github.event.issue.number }}" --comment "已生成并部署。"

