name: Process Submitted Link

on:
  workflow_dispatch:
    inputs:
      article_url:
        description: Article URL to process
        required: true
      request_id:
        description: Optional request id
        required: false
      issue_number:
        description: Optional issue number to reply to
        required: false
  issues:
    types:
      - opened
      - edited
      - reopened
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  process:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Article Request]')) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.issue.title, '[Article Request]') && contains(github.event.comment.body, '/process'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Extract request URL
        id: request
        env:
          FEED_USER: ${{ secrets.FEED_USER }}
          FEED_PASSWORD: ${{ secrets.FEED_PASSWORD }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const inputUrl = event.inputs?.article_url;
          const issue = event.issue;
          const text = inputUrl ? `ARTICLE_URL: ${inputUrl}` : `${issue?.title || ""}\n${issue?.body || ""}\n${event.comment?.body || ""}`;
          const output = (values) => {
            const lines = Object.entries(values).map(([key, value]) => `${key}=${String(value).replace(/\r?\n/g, " ")}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${lines.join("\n")}\n`);
          };
          const issueNumber = event.inputs?.issue_number || issue?.number || "";
          const reject = (message) => {
            output({ ok: "false", error: message, issue_number: issueNumber });
            if (event.inputs) {
              throw new Error(message);
            }
            process.exit(0);
          };
          const explicit = text.match(/ARTICLE_URL:\s*(https?:\/\/[^\s<>)\]]+)/i);
          const fallback = text.match(/https?:\/\/[^\s<>)\]]+/i);
          const url = explicit?.[1] || fallback?.[0];
          if (!url) {
            reject("没有在提交内容里找到有效文章链接。");
          }

          if (!event.inputs) {
            const authUser = text.match(/AUTH_USER:\s*([^\n\r]+)/i)?.[1]?.trim();
            const authSignature = text.match(/AUTH_SIGNATURE:\s*([a-f0-9]{64})/i)?.[1]?.trim().toLowerCase();
            const expectedUser = process.env.FEED_USER;
            const expectedPassword = process.env.FEED_PASSWORD;
            if (!expectedUser || !expectedPassword) {
              reject("后端还没有配置 FEED_USER 或 FEED_PASSWORD。");
            }

            const urlVariants = new Set([url]);
            try {
              const normalized = new URL(url).toString();
              urlVariants.add(normalized);
              urlVariants.add(normalized.replace(/\/$/, ""));
              urlVariants.add(`${normalized.replace(/\/$/, "")}/`);
            } catch {
              reject("文章链接格式不正确。");
            }
            const expectedSignatures = [...urlVariants].map((candidateUrl) =>
              crypto.createHash("sha256").update(`${expectedUser}:${expectedPassword}:${candidateUrl}`).digest("hex")
            );

            if (authUser !== expectedUser || !expectedSignatures.includes(authSignature)) {
              reject("账号或密码校验失败，请重新输入后再提交。");
            }
          }

          const requestId = event.inputs?.request_id || (issue ? `issue-${issue.number}` : `manual-${Date.now()}`);
          output({ ok: "true", url, request_id: requestId, issue_number: issueNumber });
          NODE

      - name: Reply to invalid request
        if: steps.request.outputs.ok != 'true' && steps.request.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ERROR: ${{ steps.request.outputs.error }}
        run: |
          cat > /tmp/article-invalid.md <<EOF
          没有开始处理：${REQUEST_ERROR}

          请确认账号、密码和文章链接后重新提交。
          EOF
          gh issue comment "${{ steps.request.outputs.issue_number }}" --body-file /tmp/article-invalid.md

      - name: Generate article from submitted link
        if: steps.request.outputs.ok == 'true'
        id: generate
        run: node scripts/generate-daily-article.mjs
        env:
          ARTICLE_URL: ${{ steps.request.outputs.url }}
          ARTICLE_REQUEST_ID: ${{ steps.request.outputs.request_id }}
          PAGES_BASE_URL: https://yanglei-985.github.io/article
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}

      - name: Verify output
        if: steps.request.outputs.ok == 'true'
        run: node scripts/check-output.mjs

      - name: Commit generated files
        if: steps.request.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs outputs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: process submitted article link"
            git push
          fi

      - name: Setup Pages
        if: steps.request.outputs.ok == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.request.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: steps.request.outputs.ok == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Reply to issue
        if: steps.request.outputs.ok == 'true' && steps.request.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTICLE_URL: ${{ steps.generate.outputs.article_url }}
          SNIPPET_URL: ${{ steps.generate.outputs.snippet_url }}
        run: |
          cat > /tmp/article-reply.md <<EOF
          处理完成：${ARTICLE_URL}

          公众号 HTML：${SNIPPET_URL}
          EOF
          gh issue comment "${{ steps.request.outputs.issue_number }}" --body-file /tmp/article-reply.md
          gh issue close "${{ steps.request.outputs.issue_number }}" --comment "已生成并部署。"
